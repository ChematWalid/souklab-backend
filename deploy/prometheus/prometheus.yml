global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: souklab
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:8080]
  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets: [caddy:2019]
  - job_name: backup
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
