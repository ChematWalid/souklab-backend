spring.application.name=souklab
server.port=${PORT}
spring.config.import=optional:file:.env[.properties]

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Pagination Defaults and Limits
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# JWT Security
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-ms=${APP_JWT_ACCESS_EXP}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_EXP}

# Security & Account Lockout
app.auth.lockout.max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
app.auth.lockout.duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES:15}
app.auth.verification.max-attempts=${AUTH_VERIFICATION_MAX_ATTEMPTS:5}
app.auth.verification.expiration-minutes=${AUTH_VERIFICATION_EXPIRATION_MINUTES:15}
app.auth.verification.code-length=${AUTH_VERIFICATION_CODE_LENGTH:6}

# Global API Rate Limiting
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY:100}
app.rate-limit.refill-duration=${APP_RATE_LIMIT_REFILL_DURATION:1m}
app.rate-limit.cache.maximum-size=${APP_RATE_LIMIT_CACHE_MAX_SIZE:10000}
app.rate-limit.cache.expire-after-access=${APP_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:10m}

# App Properties: Search & Elasticsearch (Bound to AppProperties.Search)
app.search.enabled=${HIBERNATE_SEARCH_ENABLED:true}
app.search.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
app.search.username=${ELASTICSEARCH_USERNAME:}
app.search.password=${ELASTICSEARCH_PASSWORD:}
app.search.connection-timeout=${ELASTICSEARCH_CONNECTION_TIMEOUT:5000}
app.search.read-timeout=${ELASTICSEARCH_READ_TIMEOUT:30000}
app.search.index-prefix=${ELASTICSEARCH_INDEX_PREFIX:souklab_}
app.search.schema-management=${HIBERNATE_SEARCH_SCHEMA_MANAGEMENT:create-or-update}
app.search.sync-on-startup=${SEARCH_SYNC_ON_STARTUP:true}

# Hibernate Search & Elasticsearch Integration
spring.jpa.properties.hibernate.search.enabled=${app.search.enabled}
spring.jpa.properties.hibernate.search.backend.type=elasticsearch
spring.jpa.properties.hibernate.search.backend.uris=${app.search.uris}
spring.jpa.properties.hibernate.search.backend.username=${app.search.username}
spring.jpa.properties.hibernate.search.backend.password=${app.search.password}
spring.jpa.properties.hibernate.search.backend.connection_timeout=${app.search.connection-timeout}
spring.jpa.properties.hibernate.search.backend.read_timeout=${app.search.read-timeout}
spring.jpa.properties.hibernate.search.backend.version=${ELASTICSEARCH_VERSION:8.15}
spring.jpa.properties.hibernate.search.backend.version_check.enabled=${ELASTICSEARCH_VERSION_CHECK_ENABLED:false}
spring.jpa.properties.hibernate.search.schema_management.strategy=${app.search.schema-management}
spring.jpa.properties.hibernate.search.backend.analysis.configurer=com.project.souklab.config.search.CustomElasticsearchAnalysisConfigurer
spring.jpa.properties.hibernate.search.indexing.plan.synchronization.strategy=${HIBERNATE_SEARCH_SYNC_STRATEGY:write-sync}

# File Upload & Storage Locations
app.storage.upload-dir=${APP_STORAGE_UPLOADS}
app.storage.thumbnails=${APP_STORAGE_THUMBNAILS}
app.storage.indexes=${APP_STORAGE_INDEXES}
app.storage.file-serving-prefix=${APP_STORAGE_FILE_SERVING_PREFIX:/api/v1/files/}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# File Storage Module Abstraction (D.0a / D.0b)
storage.provider=${STORAGE_PROVIDER:in-memory}
storage.validation.max-file-size=${STORAGE_MAX_FILE_SIZE:15MB}
storage.validation.allowed-mime-types=${STORAGE_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,application/pdf}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT:http://localhost:9000}
storage.s3.region=${STORAGE_S3_REGION:us-east-1}
storage.s3.bucket=${STORAGE_S3_BUCKET:souklab-files}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY:}
storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS:true}
storage.s3.auto-create-bucket=${STORAGE_S3_AUTO_CREATE_BUCKET:true}

# Antivirus Scanning (ClamAV)
storage.virus-scan.enabled=${STORAGE_VIRUS_SCAN_ENABLED:false}
storage.virus-scan.host=${STORAGE_VIRUS_SCAN_HOST:localhost}
storage.virus-scan.port=${STORAGE_VIRUS_SCAN_PORT:3310}
storage.virus-scan.connection-timeout=${STORAGE_VIRUS_SCAN_CONNECTION_TIMEOUT:2000ms}
storage.virus-scan.read-timeout=${STORAGE_VIRUS_SCAN_READ_TIMEOUT:10000ms}
storage.virus-scan.fail-open=${STORAGE_VIRUS_SCAN_FAIL_OPEN:false}

# File Storage Rate Limiting (D.0e)
storage.rate-limit.enabled=${STORAGE_RATE_LIMIT_ENABLED:true}
storage.rate-limit.capacity=${STORAGE_RATE_LIMIT_CAPACITY:120}
storage.rate-limit.refill-duration=${STORAGE_RATE_LIMIT_REFILL_DURATION:1m}
storage.rate-limit.cache.maximum-size=${STORAGE_RATE_LIMIT_CACHE_MAX_SIZE:10000}
storage.rate-limit.cache.expire-after-access=${STORAGE_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:10m}

# User Avatar Configuration
avatar.max-per-user=${AVATAR_MAX_PER_USER:10}
avatar.allowed-mime-types=${AVATAR_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}
avatar.rate-limit.enabled=${AVATAR_RATE_LIMIT_ENABLED:true}
avatar.rate-limit.capacity=${AVATAR_RATE_LIMIT_CAPACITY:5}
avatar.rate-limit.refill-duration=${AVATAR_RATE_LIMIT_REFILL_DURATION:1m}
avatar.rate-limit.cache.maximum-size=${AVATAR_RATE_LIMIT_CACHE_MAX_SIZE:1000}
avatar.rate-limit.cache.expire-after-access=${AVATAR_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:10m}

# Artisan Showcase & Certifications
app.artisan.gallery.max-images=${ARTISAN_GALLERY_MAX_IMAGES:20}
app.artisan.gallery.max-file-size=${ARTISAN_GALLERY_MAX_FILE_SIZE:10MB}
app.artisan.gallery.allowed-mime-types=${ARTISAN_GALLERY_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}
app.artisan.certification.max-count=${ARTISAN_CERTIFICATION_MAX_COUNT:10}
app.artisan.certification.max-file-size=${ARTISAN_CERTIFICATION_MAX_FILE_SIZE:15MB}
app.artisan.certification.allowed-mime-types=${ARTISAN_CERTIFICATION_ALLOWED_MIME_TYPES:application/pdf,image/jpeg,image/png}
app.artisan.formateur.reapply-cooldown-days=${ARTISAN_FORMATEUR_REAPPLY_COOLDOWN_DAYS:14}

# Formations & Masterclasses
app.formation.thumbnail.max-file-size=${FORMATION_THUMBNAIL_MAX_FILE_SIZE:10MB}
app.formation.thumbnail.allowed-mime-types=${FORMATION_THUMBNAIL_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp}
app.formation.file.max-count=${FORMATION_FILE_MAX_COUNT:10}
app.formation.file.max-file-size=${FORMATION_FILE_MAX_FILE_SIZE:25MB}
app.formation.file.allowed-mime-types=${FORMATION_FILE_ALLOWED_MIME_TYPES:application/pdf,image/jpeg,image/png}
app.formation.default-currency=${FORMATION_DEFAULT_CURRENCY:DZD}
app.formation.cancellation.deadline-hours=${FORMATION_CANCELLATION_DEADLINE_HOURS:24}
app.formation.pagination.default-page-size=${FORMATION_DEFAULT_PAGE_SIZE:10}


# Mail Configuration (SMTP / MailerSend)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS}
app.email.use-smtp=${APP_EMAIL_USE_SMTP}
app.mailersend.api-key=${MAILERSEND_API_KEY}
app.mailersend.api-url=${MAILERSEND_API_URL}
app.mailersend.sender-email=${MAILERSEND_SENDER_EMAIL}
app.mailersend.sender-name=${MAILERSEND_SENDER_NAME}

# Support Contact
app.support.email=${APP_SUPPORT_EMAIL:support@souklab.dz}
app.support.contact-message=${APP_SUPPORT_CONTACT_MESSAGE:Please contact support.}

# Chargily Pay V2 Integration
app.chargily.api-key=${CHARGILY_API_KEY}
app.chargily.secret-key=${CHARGILY_SECRET_KEY}
app.chargily.mode=${CHARGILY_MODE}
app.chargily.webhook-secret=${CHARGILY_WEBHOOK_SECRET}

# Admin Seed Account (required via environment, no fallback)
app.admin.default-email=${APP_ADMIN_DEFAULT_EMAIL}
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD}
app.admin.default-ban-reason=${APP_ADMIN_DEFAULT_BAN_REASON:Account banned by administrator}
app.admin.default-timeout-reason=${APP_ADMIN_DEFAULT_TIMEOUT_REASON:Account timed out by administrator}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# WebSocket STOMP Broker Relay (RabbitMQ)
app.relay.host=${RELAY_HOST}
app.relay.port=${RELAY_PORT}
app.relay.client-login=${RELAY_CLIENT_LOGIN}
app.relay.client-passcode=${RELAY_CLIENT_PASSCODE}
app.relay.system-login=${RELAY_SYSTEM_LOGIN}
app.relay.system-passcode=${RELAY_SYSTEM_PASSCODE}

# Google OAuth Configuration
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}
app.oauth.intent-cookie-max-age-seconds=${OAUTH_INTENT_COOKIE_MAX_AGE_SECONDS:300}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}

# Logging Levels (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=${APP_LOGGING_LEVEL_ROOT}
logging.level.com.project.souklab=${APP_LOGGING_LEVEL_APP}
logging.level.org.hibernate.search=${APP_LOGGING_LEVEL_SEARCH}
logging.level.org.hibernate.search.backend.elasticsearch.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS}
logging.level.org.hibernate.search.backend.elasticsearch.client.rest.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS}
logging.level.org.elasticsearch.client=${APP_LOGGING_LEVEL_ELASTICSEARCH}
