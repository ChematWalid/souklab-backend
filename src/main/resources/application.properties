spring.application.name=souklab
server.port=${PORT}
spring.config.import=optional:file:.env[.properties]
spring.flyway.enabled=${FLYWAY_ENABLED}

# Database Configuration (MariaDB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_DEFAULT_BATCH_FETCH_SIZE}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_THRESHOLD}

# Pagination Defaults and Limits
spring.data.web.pageable.default-page-size=${PAGEABLE_DEFAULT_SIZE}
spring.data.web.pageable.max-page-size=${PAGEABLE_MAX_SIZE}

# JWT Security
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-ms=${APP_JWT_ACCESS_EXP}
app.jwt.refresh-token-expiration-ms=${APP_JWT_REFRESH_EXP}

# Security & Account Lockout
app.auth.lockout.max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS}
app.auth.lockout.duration-minutes=${AUTH_LOCKOUT_DURATION_MINUTES}
app.auth.verification.max-attempts=${AUTH_VERIFICATION_MAX_ATTEMPTS}
app.auth.verification.expiration-minutes=${AUTH_VERIFICATION_EXPIRATION_MINUTES}
app.auth.verification.code-length=${AUTH_VERIFICATION_CODE_LENGTH}

# Global API Rate Limiting
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED}
app.rate-limit.capacity=${APP_RATE_LIMIT_CAPACITY}
app.rate-limit.refill-duration=${APP_RATE_LIMIT_REFILL_DURATION}
app.rate-limit.cache.maximum-size=${APP_RATE_LIMIT_CACHE_MAX_SIZE}
app.rate-limit.cache.expire-after-access=${APP_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS}

# App Properties: Search & Elasticsearch (Bound to AppProperties.Search)
app.search.enabled=${HIBERNATE_SEARCH_ENABLED}
app.search.uris=${ELASTICSEARCH_URIS}
app.search.username=${ELASTICSEARCH_USERNAME}
app.search.password=${ELASTICSEARCH_PASSWORD}
app.search.connection-timeout=${ELASTICSEARCH_CONNECTION_TIMEOUT}
app.search.read-timeout=${ELASTICSEARCH_READ_TIMEOUT}
app.search.index-prefix=${ELASTICSEARCH_INDEX_PREFIX}
app.search.schema-management=${HIBERNATE_SEARCH_SCHEMA_MANAGEMENT}
app.search.sync-on-startup=${SEARCH_SYNC_ON_STARTUP}
app.search.mass-indexing.threads-to-load-objects=${SEARCH_MASS_INDEXING_THREADS}
app.search.mass-indexing.batch-size-to-load-objects=${SEARCH_MASS_INDEXING_BATCH_SIZE}
app.search.mass-indexing.id-fetch-size=${SEARCH_MASS_INDEXING_ID_FETCH_SIZE}

# Application execution and cache tuning
app.async.application.core-pool-size=${ASYNC_APPLICATION_CORE_POOL_SIZE}
app.async.application.max-pool-size=${ASYNC_APPLICATION_MAX_POOL_SIZE}
app.async.application.queue-capacity=${ASYNC_APPLICATION_QUEUE_CAPACITY}
app.async.application.thread-name-prefix=${ASYNC_APPLICATION_THREAD_NAME_PREFIX}
app.async.workflow.core-pool-size=${ASYNC_WORKFLOW_CORE_POOL_SIZE}
app.async.workflow.max-pool-size=${ASYNC_WORKFLOW_MAX_POOL_SIZE}
app.async.workflow.queue-capacity=${ASYNC_WORKFLOW_QUEUE_CAPACITY}
app.async.workflow.thread-name-prefix=${ASYNC_WORKFLOW_THREAD_NAME_PREFIX}
app.cache.expire-after-write=${APP_CACHE_EXPIRE_AFTER_WRITE}
app.cache.maximum-size=${APP_CACHE_MAXIMUM_SIZE}

# Hibernate Search & Elasticsearch Integration
spring.jpa.properties.hibernate.search.enabled=${app.search.enabled}
spring.jpa.properties.hibernate.search.backend.type=elasticsearch
spring.jpa.properties.hibernate.search.backend.uris=${app.search.uris}
spring.jpa.properties.hibernate.search.backend.username=${app.search.username}
spring.jpa.properties.hibernate.search.backend.password=${app.search.password}
spring.jpa.properties.hibernate.search.backend.connection_timeout=${app.search.connection-timeout}
spring.jpa.properties.hibernate.search.backend.read_timeout=${app.search.read-timeout}
spring.jpa.properties.hibernate.search.backend.version=${ELASTICSEARCH_VERSION}
spring.jpa.properties.hibernate.search.backend.version_check.enabled=${ELASTICSEARCH_VERSION_CHECK_ENABLED}
spring.jpa.properties.hibernate.search.schema_management.strategy=${app.search.schema-management}
spring.jpa.properties.hibernate.search.backend.analysis.configurer=com.project.souklab.config.search.CustomElasticsearchAnalysisConfigurer
spring.jpa.properties.hibernate.search.indexing.plan.synchronization.strategy=${HIBERNATE_SEARCH_SYNC_STRATEGY}

# File Upload & Storage Locations
app.storage.upload-dir=${APP_STORAGE_UPLOADS}
app.storage.thumbnails=${APP_STORAGE_THUMBNAILS}
app.storage.indexes=${APP_STORAGE_INDEXES}
app.storage.file-serving-prefix=${APP_STORAGE_FILE_SERVING_PREFIX}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}

# File Storage Module Abstraction (D.0a / D.0b)
storage.provider=${STORAGE_PROVIDER}
storage.validation.max-file-size=${STORAGE_MAX_FILE_SIZE}
storage.validation.allowed-mime-types=${STORAGE_ALLOWED_MIME_TYPES}
storage.s3.endpoint=${STORAGE_S3_ENDPOINT}
storage.s3.region=${STORAGE_S3_REGION}
storage.s3.bucket=${STORAGE_S3_BUCKET}
storage.s3.access-key=${STORAGE_S3_ACCESS_KEY}
storage.s3.secret-key=${STORAGE_S3_SECRET_KEY}
storage.s3.path-style-access=${STORAGE_S3_PATH_STYLE_ACCESS}
storage.s3.auto-create-bucket=${STORAGE_S3_AUTO_CREATE_BUCKET}

# Antivirus Scanning (ClamAV)
storage.virus-scan.enabled=${STORAGE_VIRUS_SCAN_ENABLED}
storage.virus-scan.host=${STORAGE_VIRUS_SCAN_HOST}
storage.virus-scan.port=${STORAGE_VIRUS_SCAN_PORT}
storage.virus-scan.connection-timeout=${STORAGE_VIRUS_SCAN_CONNECTION_TIMEOUT}
storage.virus-scan.read-timeout=${STORAGE_VIRUS_SCAN_READ_TIMEOUT}
storage.virus-scan.fail-open=${STORAGE_VIRUS_SCAN_FAIL_OPEN}

# File Storage Rate Limiting (D.0e)
storage.rate-limit.enabled=${STORAGE_RATE_LIMIT_ENABLED}
storage.rate-limit.capacity=${STORAGE_RATE_LIMIT_CAPACITY}
storage.rate-limit.refill-duration=${STORAGE_RATE_LIMIT_REFILL_DURATION}
storage.rate-limit.cache.maximum-size=${STORAGE_RATE_LIMIT_CACHE_MAX_SIZE}
storage.rate-limit.cache.expire-after-access=${STORAGE_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS}

# User Avatar Configuration
avatar.max-per-user=${AVATAR_MAX_PER_USER}
avatar.allowed-mime-types=${AVATAR_ALLOWED_MIME_TYPES}
avatar.rate-limit.enabled=${AVATAR_RATE_LIMIT_ENABLED}
avatar.rate-limit.capacity=${AVATAR_RATE_LIMIT_CAPACITY}
avatar.rate-limit.refill-duration=${AVATAR_RATE_LIMIT_REFILL_DURATION}
avatar.rate-limit.cache.maximum-size=${AVATAR_RATE_LIMIT_CACHE_MAX_SIZE}
avatar.rate-limit.cache.expire-after-access=${AVATAR_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS}

# Artisan Showcase & Certifications
app.artisan.gallery.max-images=${ARTISAN_GALLERY_MAX_IMAGES}
app.artisan.gallery.max-file-size=${ARTISAN_GALLERY_MAX_FILE_SIZE}
app.artisan.gallery.allowed-mime-types=${ARTISAN_GALLERY_ALLOWED_MIME_TYPES}
app.artisan.certification.max-count=${ARTISAN_CERTIFICATION_MAX_COUNT}
app.artisan.certification.max-file-size=${ARTISAN_CERTIFICATION_MAX_FILE_SIZE}
app.artisan.certification.allowed-mime-types=${ARTISAN_CERTIFICATION_ALLOWED_MIME_TYPES}
app.artisan.formateur.reapply-cooldown-days=${ARTISAN_FORMATEUR_REAPPLY_COOLDOWN_DAYS}

# Formations & Masterclasses
app.formation.thumbnail.max-file-size=${FORMATION_THUMBNAIL_MAX_FILE_SIZE}
app.formation.thumbnail.allowed-mime-types=${FORMATION_THUMBNAIL_ALLOWED_MIME_TYPES}
app.formation.file.max-count=${FORMATION_FILE_MAX_COUNT}
app.formation.file.max-file-size=${FORMATION_FILE_MAX_FILE_SIZE}
app.formation.file.allowed-mime-types=${FORMATION_FILE_ALLOWED_MIME_TYPES}
app.formation.default-currency=${FORMATION_DEFAULT_CURRENCY}
app.formation.cancellation.deadline-hours=${FORMATION_CANCELLATION_DEADLINE_HOURS}
app.formation.pagination.default-page-size=${FORMATION_DEFAULT_PAGE_SIZE}

# Artisan directory pagination policy
app.directory.default-page-index=${DIRECTORY_DEFAULT_PAGE_INDEX}
app.directory.default-page-size=${DIRECTORY_DEFAULT_PAGE_SIZE}
app.directory.min-page-size=${DIRECTORY_MIN_PAGE_SIZE}
app.directory.max-page-size=${DIRECTORY_MAX_PAGE_SIZE}

# Realtime chat policy and protocol configuration
app.chat.message-max-length=${CHAT_MESSAGE_MAX_LENGTH}
app.chat.attachment-max-count=${CHAT_ATTACHMENT_MAX_COUNT}
app.chat.min-page-size=${CHAT_MIN_PAGE_SIZE}
app.chat.default-page-size=${CHAT_DEFAULT_PAGE_SIZE}
app.chat.max-page-size=${CHAT_MAX_PAGE_SIZE}
app.chat.cursor-lifetime=${CHAT_CURSOR_LIFETIME}
app.chat.typing-event-interval=${CHAT_TYPING_EVENT_INTERVAL}
app.chat.websocket-protocol-version=${CHAT_WEBSOCKET_PROTOCOL_VERSION}
app.chat.application-destination-prefix=${CHAT_APPLICATION_DESTINATION_PREFIX}
app.chat.user-destination-prefix=${CHAT_USER_DESTINATION_PREFIX}
app.chat.message-destination-prefix=${CHAT_MESSAGE_DESTINATION_PREFIX}
app.chat.event-destination=${CHAT_EVENT_DESTINATION}
app.chat.presence-destination=${CHAT_PRESENCE_DESTINATION}
app.chat.notification-destination=${CHAT_NOTIFICATION_DESTINATION}
app.chat.websocket-endpoint=${CHAT_WEBSOCKET_ENDPOINT}
app.chat.broker-destination-prefixes=${CHAT_BROKER_DESTINATION_PREFIXES}
app.chat.unresolved-user-destination=${CHAT_UNRESOLVED_USER_DESTINATION}
app.chat.user-registry-broadcast=${CHAT_USER_REGISTRY_BROADCAST}
app.notification.max-message-length=${NOTIFICATION_MAX_MESSAGE_LENGTH}
app.feed.max-media-per-post=${FEED_MAX_MEDIA_PER_POST}
app.feed.allowed-image-mime-types=${FEED_ALLOWED_IMAGE_MIME_TYPES}


# Mail Configuration (SMTP / MailerSend)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS}
app.email.use-smtp=${APP_EMAIL_USE_SMTP}
app.mailersend.api-key=${MAILERSEND_API_KEY}
app.mailersend.api-url=${MAILERSEND_API_URL}
app.mailersend.sender-email=${MAILERSEND_SENDER_EMAIL}
app.mailersend.sender-name=${MAILERSEND_SENDER_NAME}

# Support Contact
app.support.email=${APP_SUPPORT_EMAIL}
app.support.contact-message=${APP_SUPPORT_CONTACT_MESSAGE}

# Chargily Pay V2 Integration
app.chargily.api-key=${CHARGILY_API_KEY}
app.chargily.secret-key=${CHARGILY_SECRET_KEY}
app.chargily.mode=${CHARGILY_MODE}
app.chargily.webhook-secret=${CHARGILY_WEBHOOK_SECRET}

# Admin Seed Account (required via environment, no fallback)
app.admin.default-email=${APP_ADMIN_DEFAULT_EMAIL}
app.admin.default-password=${APP_ADMIN_DEFAULT_PASSWORD}
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED}
app.admin.default-ban-reason=${APP_ADMIN_DEFAULT_BAN_REASON}
app.admin.default-timeout-reason=${APP_ADMIN_DEFAULT_TIMEOUT_REASON}

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# WebSocket STOMP Broker Relay (RabbitMQ)
app.relay.host=${RELAY_HOST}
app.relay.port=${RELAY_PORT}
app.relay.client-login=${RELAY_CLIENT_LOGIN}
app.relay.client-passcode=${RELAY_CLIENT_PASSCODE}
app.relay.system-login=${RELAY_SYSTEM_LOGIN}
app.relay.system-passcode=${RELAY_SYSTEM_PASSCODE}

# Google OAuth Configuration
app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
app.oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}
app.oauth.intent-cookie-max-age-seconds=${OAUTH_INTENT_COOKIE_MAX_AGE_SECONDS}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}

# Logging Levels (TRACE, DEBUG, INFO, WARN, ERROR)
logging.level.root=${APP_LOGGING_LEVEL_ROOT}
logging.level.com.project.souklab=${APP_LOGGING_LEVEL_APP}
logging.level.org.hibernate.search=${APP_LOGGING_LEVEL_SEARCH}
logging.level.org.hibernate.search.backend.elasticsearch.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS}
logging.level.org.hibernate.search.backend.elasticsearch.client.rest.request=${APP_LOGGING_LEVEL_SEARCH_REQUESTS}
logging.level.org.elasticsearch.client=${APP_LOGGING_LEVEL_ELASTICSEARCH}

# Operational endpoints. Details remain hidden and health groups are suitable for orchestrator probes.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=false
