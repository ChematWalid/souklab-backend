# Production requires an externally managed schema and search indexes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.search.schema_management.strategy=validate
spring.flyway.enabled=${FLYWAY_ENABLED}
management.endpoint.health.show-details=never

# Uploaded content must be scanned before it is made available.
storage.virus-scan.enabled=${STORAGE_VIRUS_SCAN_ENABLED}
storage.s3.auto-create-bucket=false
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED}
