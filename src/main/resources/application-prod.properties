# Production requires an externally managed schema and search indexes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.search.schema_management.strategy=${HIBERNATE_SEARCH_SCHEMA_MANAGEMENT}
spring.flyway.enabled=${FLYWAY_ENABLED}
app.rate-limit.backend=redis
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT}
logging.level.root=INFO
logging.level.com.project.souklab=INFO
logging.level.org.hibernate.search=WARN
logging.level.org.hibernate.search.backend.elasticsearch.request=WARN
logging.level.org.hibernate.search.backend.elasticsearch.client.rest.request=WARN
logging.level.org.elasticsearch.client=WARN
management.endpoint.health.show-details=when-authorized
management.endpoint.health.group.readiness.include=readinessState,db,storage,search,relay,antivirus,redis,rabbit,chargily

# Uploaded content must be scanned before it is made available.
storage.virus-scan.enabled=${STORAGE_VIRUS_SCAN_ENABLED}
storage.s3.auto-create-bucket=false
app.admin.bootstrap-enabled=${APP_ADMIN_BOOTSTRAP_ENABLED}
