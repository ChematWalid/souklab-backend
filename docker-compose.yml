# ==============================================================================
# LOCAL DEVELOPMENT ONLY
# This docker-compose configuration is intended strictly for local development
# and automated integration testing. It is NOT a production deployment definition.
# The default fallback credentials (${MINIO_ROOT_USER:-minioadmin}) are acceptable
# only within local dev environments and must NEVER be used in staging or production.
# In production, file storage connects to real AWS S3 or Cloudflare R2 via secure
# environment variables and IAM credentials.
# ==============================================================================
services:
  mariadb:
    image: mariadb:11.4
    container_name: souklab-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-souklab_db}
      MARIADB_USER: ${DB_USERNAME:-souklab_test}
      MARIADB_PASSWORD: ${DB_PASSWORD:-souklab_test_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-souklab_root_password}
    ports:
      - "${MARIADB_HOST_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: souklab-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-souklab_test}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-souklab_test_password}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"]
    ports:
      - "5672:5672"
      - "61613:61613"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: souklab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    container_name: souklab-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3310"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: souklab-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mariadb_data:
    name: souklab_mariadb_data
  rabbitmq_data:
    name: souklab_rabbitmq_data
  minio_data:
    name: souklab_minio_data_v1
  clamav_data:
    name: souklab_clamav_data
  es_data:
    name: souklab_es_data
