# ==============================================================================
# LOCAL DEVELOPMENT ONLY
# This docker-compose configuration is intended strictly for local development
# and automated integration testing. It is NOT a production deployment definition.
# The default fallback credentials (${MINIO_ROOT_USER:-minioadmin}) are acceptable
# only within local dev environments and must NEVER be used in staging or production.
# In production, file storage connects to real AWS S3 or Cloudflare R2 via secure
# environment variables and IAM credentials.
# ==============================================================================
services:
  minio:
    image: minio/minio:latest
    container_name: souklab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:1.4
    container_name: souklab-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: souklab-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx1024m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  minio_data:
    name: souklab_minio_data
  clamav_data:
    name: souklab_clamav_data
  es_data:
    name: souklab_es_data

